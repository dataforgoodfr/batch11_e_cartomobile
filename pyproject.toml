[project]
name = "batch11-e-cartomobile"
version = "0.1.0"
description = "Encourager et planifier la mobilité électrique dans les territoires avec l’Open-Data."
authors = [{ name = "mromagne", email = "michael.romagne@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.23.1",
    "folium>=0.14",
    "jupyter>=1.0.0,<2.0.0",
    "geopandas>=0.12.2,<2.0.0",
    "isort>=5.12.0,<6.0.0",
    "pre-commit>=3.2.2,<4.0.0",
    "flake8>=6.0.0,<7.0.0",
    "matplotlib>=3.7.1,<4.0.0",
    "requests==2.29.0",
    "seaborn>=0.12.2",
    "numpy>=1.20.3",
    "bs4>=0.0.1,<0.0.2",
    "ipykernel>=6.22.0,<7.0.0",
    "nbqa>=1.7.0,<2.0.0",
    "umap-learn>=0.5.3,<0.6.0",
    "pyarrow>=11.0.0",
    "ipywidgets>=8.0.6,<9.0.0",
    "dask-geopandas>=0.3.0,<0.4.0",
    "ipython_genutils>=0.2.0,<0.3.0",
    "css-html-js-minify>=2.5.5,<3.0.0",
    "mapbox>=0.18.1,<0.19.0",
    "black>=23.3.0,<24.0.0",
    "plotly>=5.14.1,<6.0.0",
    "pandas>=1.5.3, <4.0.0",
    "pytest>=7.3.1,<8.0.0",
    "scikit-learn>=1.2.2,<2.0.0",
    "streamlit-folium>=0.11.1,<1.0.0",
    "pytest-shutil>=1.7.0,<2.0.0",
    "SQLAlchemy>=2.0.15,<3.0.0",
    "psycopg[binary]",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["e_cartomobile/tests"]

[tool.black]
line-length = 88
include = '.pyi?$'
exclude = '''
/(
    .git
  | .hg
  | .mypy_cache
  | .venv
  | _build
  | buck-out
  | build
  | dist
)/
'''