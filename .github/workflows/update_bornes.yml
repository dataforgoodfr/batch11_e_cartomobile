name: update-bornes

on:
  workflow_dispatch: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch

  schedule: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron:  '00 5 15 * *'  # every 15th of the month at 05:00 UTC

env:
  PYTHON_VERSION: '3.15'

jobs:
  update-bornes:
    runs-on: ubuntu-latest
    env:
      DATABASE: ${{ secrets.DATABASE }}
      USER: ${{ secrets.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.PORT }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true      
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: RunBornesWorkflow
        run: uv run python e_cartomobile/data_load/bornes_to_score_workflow.py
      - name: Push data to the repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git status
          git add .
          git commit -m "ci (update bornes and scores)"
          git push origin main --force
