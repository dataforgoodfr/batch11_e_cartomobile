name: update-immatriculations

on:
  workflow_dispatch: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch

  schedule: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron:  '00 5 1 * *'  # every 1st of the month at 05:00 UTC

env:
  PYTHON_VERSION: '3.15'

jobs:
  update-immatriculations:
    runs-on: ubuntu-latest
    env:
      DATABASE: ${{ secrets.DATABASE }}
      USER: ${{ secrets.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.PORT }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: RunImmatriculationsWorkflow
        run: uv run python e_cartomobile/data_load/immatriculations_workflow.py
      - name: Push data to the repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git status
          git add .
          git commit -m "ci (update immatriculations)"
          git push origin main --force
